on:
  push:
  pull_request:

name: MLOps CI

jobs:

  # Execute automated Python tests
  test:
    runs-on: ubuntu-latest

    steps:

      # Download repository code
      - name: Checkout repository
        uses: actions/checkout@v5

      # Configure Python environment
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Install pinned project dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Execute all automated tests
      - name: Run Pytest
        run: python -m pytest tests/ -v

  # Build and test Docker image
  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:

      # Download repository code
      - name: Checkout repository
        uses: actions/checkout@v5

      # Build the required Docker image
      - name: Build Docker image
        run: docker build -t mp068-api:1.0 .

      # Start container
      - name: Start container
        run: docker run -d --name mp068-api -p 8000:8000 mp068-api:1.0

      # Verify container health endpoint
      - name: Test container health
        run: |
          curl --fail --retry 15 --retry-connrefused --retry-delay 2 http://localhost:8000/health

      # Display container logs
      - name: Display Docker logs
        if: always()
        run: docker logs mp068-api || true
        